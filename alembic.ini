# Alembic configuration for InventoryLogix
# Raw SQL migrations (no SQLAlchemy models)

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://postgres:Um%25ans12er@aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
