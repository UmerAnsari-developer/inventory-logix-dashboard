# Alembic configuration for InventoryLogix
# Raw SQL migrations (no SQLAlchemy models)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Alembic reads the connection from the DATABASE_URL environment variable
# (see migrations/env.py). This placeholder is intentionally NOT a live DSN —
# never commit real credentials here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
