{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block title %}Create Backup - InventoryLogix{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <div class="eyebrow">Administration</div>
    <h1>Create Backup</h1>
  </div>
  <div class="page-actions">
    <a href="{{ url_for('admin_backup.index') }}" class="btn btn-secondary">Back to Backups</a>
  </div>
</div>

<form method="post" class="form-card" action="{{ url_for('admin_backup.create') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="form-grid">
    <label class="full"><span>Backup Name *</span>
      <input type="text" name="backup_name" required maxlength="100"
             placeholder="Descriptive name to identify this backup later">
    </label>
    <label class="full"><span>Backup Type *</span>
      <select name="backup_type">
        <option value="full">Full Backup (Schema + Data)</option>
        <option value="schema">Schema Only</option>
        <option value="data">Data Only</option>
      </select>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Create Backup</button>
    <a class="btn btn-secondary" href="{{ url_for('admin_backup.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
