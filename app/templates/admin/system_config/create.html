{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block title %}Add System Configuration Override - InventoryLogix{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <div class="eyebrow">Administration</div>
    <h1>Add System Configuration Override</h1>
  </div>
  <div class="page-actions">
    <a href="{{ url_for('admin_system_config.index') }}" class="btn btn-secondary">Back to Overrides</a>
  </div>
</div>

<form method="post" class="form-card" action="{{ url_for('admin_system_config.create') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="form-grid">
    <label class="full"><span>Key *</span>
      <input type="text" name="key" required maxlength="100"
             placeholder="e.g. rate_limit_api">
    </label>
    <label class="full"><span>Value *</span>
      <input type="text" name="value" required maxlength="500"
             placeholder="Value to set for this key">
    </label>
    <label class="full"><span>Description</span>
      <input type="text" name="description" maxlength="255"
             placeholder="What this override does (optional)">
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save Override</button>
    <a class="btn btn-secondary" href="{{ url_for('admin_system_config.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
