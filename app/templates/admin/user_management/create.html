{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block title %}Create User - InventoryLogix{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <div class="eyebrow">Administration</div>
    <h1>Create User</h1>
  </div>
  <div class="page-actions">
    <a href="{{ url_for('admin_user_management.index') }}" class="btn btn-secondary">Back to Users</a>
  </div>
</div>

<form method="post" class="form-card" action="{{ url_for('admin_user_management.create') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="form-grid">
    <label><span>Username *</span>
      <input type="text" name="username" required maxlength="50"
             placeholder="Unique login name" autocomplete="off">
    </label>
    <label><span>Email *</span>
      <input type="email" name="email" required maxlength="120"
             placeholder="user@example.com">
    </label>
    <label><span>Password *</span>
      <input type="password" name="password" required minlength="6"
             placeholder="Minimum 6 characters" autocomplete="new-password">
    </label>
    <label><span>Role *</span>
      <select name="role">
        <option value="viewer">Viewer (read-only)</option>
        <option value="manager">Manager (read-write)</option>
        <option value="admin">Admin (full access)</option>
      </select>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Create User</button>
    <a class="btn btn-secondary" href="{{ url_for('admin_user_management.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
