{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block title %}Create User - InventoryLogix{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <div class="eyebrow">Administration</div>
    <h1>Create User</h1>
  </div>
  <div class="page-actions">
    <a href="{{ url_for('admin_user_management.index') }}" class="btn btn-secondary">Back to Users</a>
  </div>
</div>

<form method="post" class="form-card" action="{{ url_for('admin_user_management.create') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="form-grid">
    <label><span>Username *</span>
      <input type="text" name="username" required maxlength="50"
             placeholder="Unique login name" autocomplete="off">
    </label>
    <label><span>Email *</span>
      <input type="email" name="email" required maxlength="120"
             placeholder="user@example.com">
    </label>
    <label><span>Password *</span>
      <input type="password" name="password" required minlength="6"
             placeholder="Minimum 6 characters" autocomplete="new-password">
    </label>
    <label><span>Role *</span>
      <select name="role">
        <option value="viewer">Viewer (read-only)</option>
        <option value="manager">Manager (read-write)</option>
        <option value="admin">Admin (full access)</option>
      </select>
    </label>
    <label><span>Full Name</span>
      <input type="text" name="full_name" maxlength="150"
             placeholder="e.g. John Smith" autocomplete="off">
    </label>
    <label><span>Department</span>
      <select name="department">
        <option value="">—</option>
        <option value="Leadership">Leadership</option>
        <option value="Procurement">Procurement</option>
        <option value="Warehouse">Warehouse</option>
        <option value="Analytics">Analytics</option>
      </select>
    </label>
    <label><span>Hierarchy Role</span>
      <select name="job_role">
        <option value="">Auto (from Role)</option>
        <option value="inventory_director">Inventory & Supply Chain Director</option>
        <option value="vp_operations">VP of Operations</option>
        <option value="procurement_manager">Procurement Manager</option>
        <option value="procurement_buyer">Procurement Buyer</option>
        <option value="procurement_coordinator">Procurement Coordinator</option>
        <option value="supplier_coordinator">Supplier Relationship Coordinator</option>
        <option value="warehouse_manager">Warehouse Operations Manager</option>
        <option value="receiving_associate">Receiving Associate</option>
        <option value="inventory_analyst">Inventory Control Analyst</option>
        <option value="demand_planning_analyst">Demand Planning Analyst</option>
      </select>
    </label>
    <label><span>Reporting Manager</span>
      <select name="reporting_manager_id">
        <option value="">— None —</option>
        {% for m in managers %}
        {% if m.id != current_user.id %}
        <option value="{{ m.id }}">{{ m.full_name or m.username }} — {{ (m.job_role or m.role) | replace('_', ' ') | title }}</option>
        {% endif %}
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Create User</button>
    <a class="btn btn-secondary" href="{{ url_for('admin_user_management.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
