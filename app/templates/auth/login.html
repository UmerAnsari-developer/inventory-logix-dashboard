{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block auth_content %}
<section class="auth-shell reveal" style="--d:0s">
  <div class="auth-card reveal" style="--d:.1s">
    <button class="auth-theme-toggle" type="button" aria-label="Toggle theme">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a class="auth-back" href="{{ url_for('ui.dashboard') }}">&larr; Back to home</a>
    <div class="auth-brand">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="InventoryLogix logo" width="30" height="30" />
      <div>
        <div class="brand-name">InventoryLogix</div>
        <span class="brand-meta">Inventory command center</span>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p class="auth-tagline">Sign in to manage stock, run EOQ, and review AI forecasts</p>
    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label><span>Username</span>
        <div class="input-wrapper">
          <input type="text" name="username" value="{{ username or '' }}" required autofocus autocomplete="username" placeholder=" ">
        </div>
      </label>
      <label><span>Password</span>
        <div class="password-wrapper">
          <input type="password" name="password" required autocomplete="current-password" id="login-password" placeholder=" ">
          <button type="button" class="password-toggle" data-target="login-password" aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72 1.88a3 3 0 1 1 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </label>
      <label class="checkbox-row"><input type="checkbox" name="remember"  required/> <span style="transform: translateY(0);">Remember me</span></label>
      <button type="submit" class="btn btn-primary auth-submit">Sign in</button>
    </form>
    <p class="auth-helper">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot password</a>
   </p>
    <p class="auth-helper">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
  </div>
</section>
{% endblock %}
