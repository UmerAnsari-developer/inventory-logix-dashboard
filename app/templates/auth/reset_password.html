{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block auth_content %}
<section class="auth-shell">
  <div class="auth-card">
    <a class="auth-back" href="{{ url_for('ui.dashboard') }}">&larr; Back to home</a>
    <div class="auth-brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-name">InventoryLogix</div>
        <span class="brand-meta">Inventory command center</span>
      </div>
    </div>
    <h1>Set a new password</h1>
    <p class="auth-tagline">Your new password must be at least 8 characters</p>
    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label><span>New password</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <label><span>Confirm password</span><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
      <button type="submit" class="btn btn-primary auth-submit">Update password</button>
    </form>
    <p class="auth-helper"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
