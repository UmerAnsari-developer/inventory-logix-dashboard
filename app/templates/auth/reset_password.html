{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block auth_content %}
<section class="auth-shell reveal" style="--d:0s">
  <div class="auth-card reveal" style="--d:.1s">
    <button class="auth-theme-toggle" type="button" aria-label="Toggle theme">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a class="auth-back" href="{{ url_for('ui.dashboard') }}">&larr; Back to home</a>
    <div class="auth-brand">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="InventoryLogix logo" width="30" height="30" />
      <div>
        <div class="brand-name">InventoryLogix</div>
        <span class="brand-meta">Inventory command center</span>
      </div>
    </div>
    <h1>Set a new password</h1>
    <p class="auth-tagline">Your new password must meet the requirements below</p>
    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label><span>New password</span>
        <div class="password-wrapper">
          <input type="password" name="password" required minlength="8" autocomplete="new-password" id="reset-password" placeholder=" ">
          <button type="button" class="password-toggle" data-target="reset-password" aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72 1.88a3 3 0 1 1 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="pw-strength" id="rst-pw-strength">
          <div class="pw-bar"><div class="pw-fill" id="rst-pw-fill"></div></div>
          <div class="pw-rules">
            <span class="pw-rule" id="rst-rule-len">8+ characters</span>
            <span class="pw-rule" id="rst-rule-letter">1 letter</span>
            <span class="pw-rule" id="rst-rule-digit">1 digit</span>
          </div>
        </div>
      </label>
      <label><span>Confirm password</span>
        <div class="password-wrapper">
          <input type="password" name="confirm" required minlength="8" autocomplete="new-password" id="reset-confirm" placeholder=" ">
          <button type="button" class="password-toggle" data-target="reset-confirm" aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72 1.88a3 3 0 1 1 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <span class="field-hint" id="rst-match-hint"></span>
      </label>
      <button type="submit" class="btn btn-primary auth-submit">Reset password</button>
    </form>
    <p class="auth-helper"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
  </div>
</section>
<script nonce="{{ csp_nonce }}">
(function(){
  var pwInput = document.getElementById('reset-password');
  var pwFill = document.getElementById('rst-pw-fill');
  var ruleLen = document.getElementById('rst-rule-len');
  var ruleLetter = document.getElementById('rst-rule-letter');
  var ruleDigit = document.getElementById('rst-rule-digit');
  var confirmInput = document.getElementById('reset-confirm');
  var matchHint = document.getElementById('rst-match-hint');

  function checkPw(){
    var v = pwInput.value;
    var score = 0;
    var hasLen = v.length >= 8;
    var hasLetter = /[A-Za-z]/.test(v);
    var hasDigit = /\d/.test(v);
    if(hasLen) score++;
    if(hasLetter) score++;
    if(hasDigit) score++;
    ruleLen.className = 'pw-rule' + (hasLen ? ' pass' : '');
    ruleLetter.className = 'pw-rule' + (hasLetter ? ' pass' : '');
    ruleDigit.className = 'pw-rule' + (hasDigit ? ' pass' : '');
    pwFill.style.width = (score/3*100)+'%';
    pwFill.className = 'pw-fill' + (score <= 1 ? ' weak' : score === 2 ? ' fair' : ' strong');
    checkMatch();
  }
  function checkMatch(){
    if(!confirmInput || !matchHint) return;
    var p = pwInput.value;
    var c = confirmInput.value;
    if(!c){ matchHint.textContent = ''; matchHint.className = 'field-hint'; return; }
    if(p === c){ matchHint.textContent = '\u2713 Passwords match'; matchHint.className = 'field-hint ok'; }
    else { matchHint.textContent = '\u2717 Passwords don\'t match'; matchHint.className = 'field-hint err'; }
  }
  if(pwInput){ pwInput.addEventListener('input', checkPw); }
  if(confirmInput){ confirmInput.addEventListener('input', checkMatch); }
})();
</script>
{% endblock %}
