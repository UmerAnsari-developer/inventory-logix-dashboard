{% extends "base.html" %}
{% set active_page = "error" %}
{% block title %}429 Too many requests{% endblock %}
{% block breadcrumb %}Too many requests{% endblock %}
{% block content %}
<section class="error-shell">
  <div class="error-card">
    <div class="error-code">429</div>
    <h1>Too many requests</h1>
    <p>Please slow down and try again in a minute.</p>
    <a class="btn btn-primary" href="{{ url_for('ui.dashboard') }}">Back to dashboard</a>
</div>
</section>
{% endblock %}
