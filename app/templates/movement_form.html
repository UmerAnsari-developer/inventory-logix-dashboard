{% extends "base.html" %}
{% set active_page = "inventory" %}
{% block title %}Record Movement{% endblock %}
{% block content %}
<section>
  <div class="page-heading"><div><div class="eyebrow">Inventory</div><h1>Stock Movement</h1></div></div>
  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="form-grid">
      <label><span>Product *</span>
        <select name="product_id" required>
          <option value="">&mdash; select a product &mdash</option>
{% for p in products %}
          <option value="{{ p.id }}">{{ p.sku }} &mdash; {{ p.name }} ({{ p.current_stock }})</option>
{% endfor %}
      </select>
    </label>
      <label><span>Type *</span>
        <select name="type" required>
          <option value="IN">Stock IN (receive</option>
          <option value="OUT">Stock OUT (dispatch</option>
          <option value="ADJUSTMENT">Adjustment</option>
          <option value="RETURN">Return</option>
      </select>
    </label>
      <label><span>Quantity *</span><input type="number" name="quantity" min="1" required></label>
      <label><span>Reference</span><input type="text" name="reference" maxlength="100"></label>
      <label class="full"><span>Notes</span><textarea name="notes" rows="3" maxlength="500"></textarea></label>
  </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save movement</button>
      <a class="btn btn-secondary" href="{{ url_for('ui.inventory') }}">Cancel</a>
  </div>
</form>
</section>
{% endblock %}
